<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse | Creative Audiovisual Studio</title>

    <style>
        /* ------------------------------
           RESET
        ------------------------------ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            color: white;
            overflow-x: hidden;
        }


        /* ------------------------------
           HERO
        ------------------------------ */

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 600px;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 70% 30%,
                    #2a2a2a 0%,
                    #111111 35%,
                    #050505 75%
                );
        }


        /* Video preparado para después */

        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: translate(-50%, -50%);

            z-index: 0;
        }


        /* Oscurece ligeramente el video */

        .hero-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.15),
                    rgba(0,0,0,0.25)
                );

            z-index: 1;
        }


        /* ------------------------------
           NAV
        ------------------------------ */

        nav {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 35px 50px;

            z-index: 10;
        }


        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
        }


        .menu {
            display: flex;
            gap: 35px;
        }


        .menu a {
            color: white;
            text-decoration: none;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 2px;

            transition: opacity 0.3s ease;
        }


        .menu a:hover {
            opacity: 0.5;
        }


        /* ------------------------------
           HERO CONTENT
        ------------------------------ */

        .hero-content {
            position: absolute;

            left: 50px;
            bottom: 60px;

            z-index: 5;
        }


        .hero-title {
            font-size: clamp(70px, 13vw, 190px);

            font-weight: 700;

            line-height: 0.8;

            letter-spacing: -7px;

            animation: fadeUp 1.2s ease forwards;
        }


        .hero-subtitle {
            margin-top: 30px;

            font-size: 13px;

            letter-spacing: 4px;

            text-transform: uppercase;

            opacity: 0;

            animation: fadeUp 1.2s ease forwards;
            animation-delay: 0.25s;
        }


        /* ------------------------------
           SCROLL INDICATOR
        ------------------------------ */

        .scroll {
            position: absolute;

            right: 50px;
            bottom: 60px;

            z-index: 5;

            font-size: 10px;

            letter-spacing: 3px;

            writing-mode: vertical-rl;

            opacity: 0.7;
        }


        /* ------------------------------
           ANIMATIONS
        ------------------------------ */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ------------------------------
           MOBILE
        ------------------------------ */

        @media (max-width: 700px) {

            nav {
                padding: 25px;
            }


            .menu {
                gap: 15px;
            }


            .menu a {
                font-size: 9px;
            }


            .hero-content {
                left: 25px;
                bottom: 40px;
            }


            .hero-title {
                letter-spacing: -3px;
            }


            .hero-subtitle {
                font-size: 10px;
                letter-spacing: 2px;
            }


            .scroll {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- HERO -->

    <section class="hero">

        <!--
        Cuando tengamos tu video,
        activaremos esta parte:

        <video
            class="hero-video"
            autoplay
            muted
            loop
            playsinline
        >
            <source src="hero.mp4" type="video/mp4">
        </video>
        -->


        <div class="hero-overlay"></div>


        <!-- MENU -->

        <nav>

            <div class="logo">
                PULSE
            </div>


            <div class="menu">

                <a href="#work">
                    WORK
                </a>

                <a href="#about">
                    ABOUT
                </a>

                <a href="#contact">
                    CONTACT
                </a>

            </div>

        </nav>


        <!-- HERO TEXT -->

        <div class="hero-content">

            <h1 class="hero-title">
                PULSE
            </h1>

            <p class="hero-subtitle">
                Creative Audiovisual Studio
            </p>

        </div>


        <div class="scroll">
            SCROLL
        </div>


    </section>


</body>

</html>
