<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse | Creative Audiovisual Studio</title>

    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            overflow-x: hidden;
        }


        /* ==============================
           HERO
        ============================== */

        .hero {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100svh;

            min-height: 600px;

            overflow: hidden;

            background: #050505;
        }


        /* ==============================
           VIDEOS
        ============================== */

        .hero-video {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            transform: translate(-50%, -50%);

            z-index: 0;
        }


        /* Desktop visible por defecto */

        .video-desktop {
            display: block;
        }


        /* Móvil oculto por defecto */

        .video-mobile {
            display: none;
        }


        /* ==============================
           OVERLAY
        ============================== */

        .hero-overlay {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.10) 0%,
                    rgba(0, 0, 0, 0.05) 45%,
                    rgba(0, 0, 0, 0.45) 100%
                );

            z-index: 1;

            pointer-events: none;
        }


        /* ==============================
           NAV
        ============================== */

        nav {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 35px 50px;

            z-index: 10;
        }


        .logo {
            font-size: 24px;

            font-weight: 700;

            letter-spacing: 4px;

            color: white;
        }


        .menu {
            display: flex;

            align-items: center;

            gap: 35px;
        }


        .menu a {
            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 2px;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        .menu a:hover {
            opacity: 0.6;

            transform: translateY(-2px);
        }


        /* ==============================
           HERO CONTENT
        ============================== */

        .hero-content {
            position: absolute;

            left: 50px;
            bottom: 60px;

            z-index: 5;
        }


        .hero-title {
            font-size: clamp(70px, 13vw, 190px);

            font-weight: 700;

            line-height: 0.8;

            letter-spacing: -7px;

            color: white;

            opacity: 0;

            animation: fadeUp 1.2s ease forwards;

            animation-delay: 0.15s;
        }


        .hero-subtitle {
            margin-top: 30px;

            font-size: 13px;

            font-weight: 500;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: white;

            opacity: 0;

            animation: fadeUp 1.2s ease forwards;

            animation-delay: 0.35s;
        }


        /* ==============================
           SCROLL INDICATOR
        ============================== */

        .scroll {
            position: absolute;

            right: 50px;
            bottom: 60px;

            z-index: 5;

            font-size: 10px;

            letter-spacing: 3px;

            writing-mode: vertical-rl;

            color: white;

            opacity: 0;

            animation: fadeIn 1.5s ease forwards;

            animation-delay: 1s;
        }


        /* ==============================
           ANIMATIONS
        ============================== */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 0.7;
            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {


            /* Cambiamos los videos */

            .video-desktop {
                display: none;
            }


            .video-mobile {
                display: block;
            }


            /* Hero */

            .hero {
                min-height: 100svh;
            }


            /* Navegación */

            nav {
                padding: 25px 22px;
            }


            .logo {
                font-size: 18px;

                letter-spacing: 3px;
            }


            .menu {
                gap: 14px;
            }


            .menu a {
                font-size: 9px;

                letter-spacing: 1.2px;
            }


            /* Texto principal */

            .hero-content {
                left: 22px;
                right: 22px;

                bottom: 40px;
            }


            .hero-title {
                font-size: clamp(65px, 25vw, 120px);

                letter-spacing: -4px;
            }


            .hero-subtitle {
                margin-top: 20px;

                font-size: 9px;

                letter-spacing: 2.5px;

                line-height: 1.5;
            }


            /* Quitamos SCROLL en móvil */

            .scroll {
                display: none;
            }

        }


        /* ==============================
           TELÉFONOS MUY PEQUEÑOS
        ============================== */

        @media (max-width: 430px) {

            .menu {
                gap: 10px;
            }


            .menu a {
                font-size: 8px;
            }


            .hero-title {
                font-size: 24vw;
            }

        }


        /* ==============================
           REDUCIR ANIMACIONES
           POR ACCESIBILIDAD
        ============================== */

        @media (prefers-reduced-motion: reduce) {

            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         HERO
    ============================== -->

    <section class="hero">


        <!-- VIDEO DESKTOP -->

        <video
            class="hero-video video-desktop"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >

            <source
                src="hero-desktop.mp4"
                type="video/mp4"
            >

        </video>



        <!-- VIDEO MOBILE -->

        <video
            class="hero-video video-mobile"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >

            <source
                src="hero-mobile.mp4"
                type="video/mp4"
            >

        </video>



        <!-- CAPA OSCURA SOBRE EL VIDEO -->

        <div class="hero-overlay"></div>



        <!-- ==============================
             MENU
        ============================== -->

        <nav>


            <div class="logo">
                PULSE
            </div>


            <div class="menu">

                <a href="#work">
                    WORK
                </a>

                <a href="#about">
                    ABOUT
                </a>

                <a href="#contact">
                    CONTACT
                </a>

            </div>


        </nav>



        <!-- ==============================
             HERO TEXT
        ============================== -->

        <div class="hero-content">


            <h1 class="hero-title">
                PULSE
            </h1>


            <p class="hero-subtitle">
                Creative Audiovisual Studio
            </p>


        </div>



        <!-- SCROLL -->

        <div class="scroll">
            SCROLL
        </div>


    </section>


</body>

</html>
